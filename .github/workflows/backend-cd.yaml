name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        working-directory: starter/backend
        run: pipenv install --dev

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

  build:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}" \
            starter/backend

      - name: Push Docker image to ECR
        run: |
          docker push "${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}"

  deploy:
    name: Deploy Backend to EKS
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}"

      - name: Setup Kubernetes tools
        uses: yokawasa/action-setup-kube-tools@v0.14.0
        with:
          setup-tools: |
            kubectl
            kustomize
          kubectl: '1.35.3'
          kustomize: '5.8.1'

      - name: Set backend image
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image \
            backend="${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}"

      - name: Deploy backend
        working-directory: starter/backend/k8s
        run: |
          kustomize build | kubectl apply -f -

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend --timeout=180s

      - name: Verify backend service
        run: |
          echo "Waiting for backend LoadBalancer hostname..."

          for i in {1..30}; do
            BACKEND_URL=$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$BACKEND_URL" ]; then
              break
            fi

            echo "Backend LoadBalancer is still pending..."
            sleep 10
          done

          if [ -z "$BACKEND_URL" ]; then
            echo "Backend LoadBalancer hostname was not assigned."
            exit 1
          fi

          echo "Backend Service URL:"
          echo "http://${BACKEND_URL}/movies"

          echo "Testing backend /movies endpoint..."

          curl --fail \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            "http://${BACKEND_URL}/movies"

          echo
          echo "Backend service verification successful."